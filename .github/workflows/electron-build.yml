name: Electron Build & Package

on:
  push:
    branches: [main, feat/ts-electron-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_ext: dmg
          - os: windows-latest
            platform: win
            artifact_ext: exe
          - os: ubuntu-latest
            platform: linux
            artifact_ext: "AppImage,deb"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: ./scripts/rebuild-native.sh --force
        shell: bash

      - name: Prune onnxruntime binaries for target platform
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            rm -rf node_modules/onnxruntime-node/bin/napi-v6/linux node_modules/onnxruntime-node/bin/napi-v6/win32 || true
          elif [ "${{ matrix.platform }}" = "win" ]; then
            rm -rf node_modules/onnxruntime-node/bin/napi-v6/darwin node_modules/onnxruntime-node/bin/napi-v6/linux || true
          else
            rm -rf node_modules/onnxruntime-node/bin/napi-v6/darwin node_modules/onnxruntime-node/bin/napi-v6/win32 || true
            rm -rf node_modules/onnxruntime-node/bin/napi-v6/linux/arm64 || true
          fi
          du -sh node_modules/onnxruntime-node || true

      - name: Build (compile TS + bundle renderer)
        run: npm run build

      - name: Package
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        timeout-minutes: 20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchid-${{ matrix.platform }}
          path: |
            electron/release/*.dmg
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.deb
          if-no-files-found: warn
          retention-days: 14
