<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./assets/orchid-icon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>Orchid</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #09090b; color: #fafafa; }
      .startup-shell { align-items: center; background: #09090b; box-sizing: border-box; display: flex; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; gap: 12px; height: 100%; justify-content: center; padding: 24px; }
      .startup-shell__icon { height: 36px; width: 36px; }
      .startup-shell__name { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
      .startup-shell__status { color: #a1a1aa; font-size: 14px; margin-top: 3px; }
      @media (prefers-reduced-motion: reduce) { .startup-shell, .startup-shell *, .startup-shell *::before, .startup-shell *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell" aria-label="Starting Orchid">
        <img class="startup-shell__icon" src="./assets/orchid-icon.svg" alt="" aria-hidden="true" />
        <div>
          <div class="startup-shell__name">Orchid</div>
          <div class="startup-shell__status" role="status" aria-live="polite">Starting Orchid…</div>
        </div>
      </main>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
